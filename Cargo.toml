[workspace]
members = ["cli", "src-tauri"]
resolver = "2"

# Профили живут здесь и только здесь: в воркспейсе секции профилей из манифестов
# участников игнорируются. Значения перенесены из cli/Cargo.toml без изменений.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
# Без `panic = "abort"`: паника обязана печатать место, где она произошла.
# В ядре отказ от разворачивания стека однажды превратил ошибку разбора
# в молчаливое падение без сообщения для пользователя.

[profile.dev]
opt-level = 1
