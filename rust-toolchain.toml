# One exact compiler for local development, CI and release builds.
# Keep both universal macOS targets installed when the pin changes.
# rust-analyzer and rust-src support local editing; CI installs only the
# components it uses and sets RUSTUP_AUTO_INSTALL=0 to avoid extra downloads.
# Historical measurements in PERFORMANCE.md retain their original toolchains.
[toolchain]
channel = "1.100.0"
components = ["rustfmt", "clippy", "rust-analyzer", "rust-src"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
