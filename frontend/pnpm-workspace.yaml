allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false

overrides:
  '@puppeteer/browsers': '3.2.1'
  deepmerge-ts: '8.0.2'
  serialize-javascript: '7.0.5'

# GHSA-vfj7-8cjw-p6xm (CVE-2026-93687) – braces, stack exhaustion through deeply
# nested patterns; high, published 2026-09-18, no fixed release (3.0.3 is the
# last). Excepted by the owner's decision of 2026-10-03: a dev dependency of the
# window tests only, it does not ship – @wdio/mocha-framework > mocha 10 >
# chokidar 3 > braces, loaded with mocha's run-helpers but called only by
# chokidar.watch in mocha's --watch mode, on patterns from our own config. No
# update breaks the chain (@wdio/mocha-framework 9.32.0 still wants mocha
# ^10.8.2, which wants chokidar ^3.5.3), and overrides are not used.
# Removed by its own commit as soon as either holds: a fixed braces is released,
# or @wdio/mocha-framework moves to a mocha without chokidar 3.
# Guard: tests/audit-exception.test.ts fails if braces reaches the tree by any
# other path or at any version but 3.0.3, or leaves it.
#
# GHSA-m5mm-p8h7-m29v – serialize-javascript below 7.1.3; low, published
# 2026-10-23. Excepted until 2026-10-31T00:00Z by the owner's decision of
# 2026-10-24 (part3-6): a dev dependency of the window tests only, it does not
# ship – @wdio/mocha-framework > mocha 10 > serialize-javascript, held at 7.0.5
# by the override above; neither it nor undici reaches dist or the binary. Not
# raised: 7.1.3 (2026-10-22 21:24 UTC) was replaced by an urgent 7.1.4 17.5
# hours later, so the line has not settled, and neither has passed the seven
# days of specification 5.1. Removed after the 3.0.0 release by raising it to a
# release that has.
# Guard: tests/audit-exception.test.ts fails from 2026-10-31T00:00Z, as soon as
# every serialize-javascript in pnpm-lock.yaml is at or past 7.1.3, and if
# either package's code turns up in the built dist.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-m5mm-p8h7-m29v
