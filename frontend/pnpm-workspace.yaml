allowBuilds:
  edgedriver: false
  esbuild: false
  geckodriver: false

overrides:
  '@puppeteer/browsers': '3.2.1'
  deepmerge-ts: '8.0.2'
  serialize-javascript: '7.1.4'

# GHSA-vfj7-8cjw-p6xm (CVE-2026-93687) – braces, stack exhaustion through deeply
# nested patterns; high, published 2026-09-18, no fixed release (3.0.3 is the
# last). Excepted by the owner's decision of 2026-10-03: a dev dependency of the
# window tests only, it does not ship – @wdio/mocha-framework > mocha 10 >
# chokidar 3 > braces, loaded with mocha's run-helpers but called only by
# chokidar.watch in mocha's --watch mode, on patterns from our own config. No
# update breaks the chain (@wdio/mocha-framework 9.32.0 still wants mocha
# ^10.8.2, which wants chokidar ^3.5.3), and overrides are not used.
# Removed by its own commit as soon as either holds: a fixed braces is released,
# or @wdio/mocha-framework moves to a mocha without chokidar 3.
# Guard: tests/audit-exception.test.ts fails if braces reaches the tree by any
# other path or at any version but 3.0.3, or leaves it.
#
# GHSA-gcqx-w48m-w2h4 – deepmerge 4.2.0 to 4.3.1, prototype poisoning of the
# objects mergeObject() returns; low, published after the gate's audit of
# 2026-10-27, no fixed release. Excepted until 2026-11-30T00:00Z by the owner's
# decision of 2026-10-28 (release-3.0.2): a build dependency only, it does not
# ship – @sveltejs/vite-plugin-svelte > deepmerge 4.3.1, called by the plugin in
# Node while Vite builds; neither dist nor the 3.0.2 image carries its code (its
# name is in THIRD-PARTY-NOTICES.md, which lists every package, and that is a
# notice, not code). Removed by its own commit as soon as either holds: a fixed
# deepmerge is released and old enough to take, or the plugin leaves it.
# Guard: tests/audit-exception.test.ts fails from 2026-11-30T00:00Z, as soon as
# no deepmerge in pnpm-lock.yaml is in 4.2.0 to 4.3.1, if anything but
# @sveltejs/vite-plugin-svelte depends on it, and if its code turns up in the
# built dist.
#
# GHSA-3g3m-2fjr-6pw4 (glob 10.5.0) and GHSA-g3hv-75wg-m249 (minimatch
# 9.0.9/10.2.6): temporary development-tool exceptions for the conservative
# 3.1.0 transition, reviewed 2026-11-15, expiring 2026-11-30T00:00Z.
# These versions are NOT patched. @wdio/config uses synchronous glob without
# an AbortSignal, on the fixed specs in wdio.conf.ts. archiver-utils also uses
# synchronous glob; webdriverio's uploadFile uses append, and our tests do not
# call it. Lint consumers use minimatch's default optimization level 1; glob
# uses level 2, but only repository-controlled test patterns reach it. Neither
# package ships in the window or the exported inventory, and corpus/user input
# does not enter these Node tools. There is no compatible fixed dependency set:
# WDIO 9 still requires glob 10; its Tauri service requires WDIO 9; the stable
# typescript-eslint release still requires minimatch 10. Forcing minimatch 11
# under glob 10 changes its RegExp-based matching contract.
# Guards in tests/audit-exception.test.ts hold the expiry, exact affected
# versions and parents, development-only roots, call sites and shipped bundles.
# Remove or reassess on any drift, or when supported fixes become available.
# Evidence and follow-up: ../docs/DEPENDENCY-REVIEW-3.1.0.md.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-gcqx-w48m-w2h4
    - GHSA-3g3m-2fjr-6pw4
    - GHSA-g3hv-75wg-m249
