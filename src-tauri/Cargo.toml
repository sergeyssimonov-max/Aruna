[package]
name = "aruna-desktop"
version = "0.2.0"
description = "Aruna — the TLHdig Hittite cuneiform corpus, as a desktop application"
authors = ["Sergey Simonov"]
license = "MIT"
repository = "https://github.com/sergeyssimonov-max/Aruna"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "aruna_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aruna = { path = "../cli" }
serde = { version = "1", features = ["derive"] }
# Читает `counts` из манифеста пакета для команды `corpus_stats`. Новой строкой
# в графе зависимостей это не становится: serde_json уже приходит сюда через
# tauri (json-patch → tauri-utils), и версия у него та же, что записана в
# lock-файле. Прямое объявление добавляет ребро, а не пакет.
serde_json = "1"
thiserror = "2"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-store = "2.4.4"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tauri-plugin-wdio = { version = "1.3.0", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]

[dev-dependencies]
# Тесты `corpus_stats` строят по каталогу-пакету на каждую ветку. Тот же крейт
# и та же строка версии, что в dev-зависимостях ядра, — в lock-файле он уже
# есть по этой причине.
tempfile = "3"
