[package]
name = "aruna"
version = "0.1.0"
description = "Aruna — the TLHdig Hittite cuneiform corpus, as a desktop application"
authors = ["Sergey Simonov"]
license = "MIT"
repository = "https://github.com/sergeyssimonov-max/Aruna"
edition = "2021"
# Measured, not guessed: 1.77.2 was declared here and is impossible — a
# dependency in the locked tree needs edition 2024, which Cargo did not stabilise
# until 1.85, and `darling` and the `icu_*` crates each require 1.88. Checked
# 2026-08-25 across 1.77.2 (refuses the manifest), 1.86 (refuses the tree) and
# 1.88 (builds).
#
# The field is not decoration: Cargo reads it when resolving, so a number lower
# than the truth widens the search to versions that cannot build here.
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "aruna_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-store = "2.4.4"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tauri-plugin-wdio = { version = "1.3.0", optional = true }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]
