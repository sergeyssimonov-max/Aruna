# macOS-only: Universal Binary .app + UDIF DMG
name: Release macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli → target
            wasm/search → target

      - name: Clippy (CLI)
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Clippy (wasm search)
        run: cargo clippy --manifest-path wasm/search/Cargo.toml --all-targets -- -D warnings

      - name: Test (CLI)
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Test (wasm search)
        run: cargo test --manifest-path wasm/search/Cargo.toml

      - name: Build wasm module for its real target
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path wasm/search/Cargo.toml

      # public/wasm/search.wasm is served to every visitor, so it must be the
      # module this commit actually contains.
      #
      # Two conditions make the comparison meaningful. The compiler is pinned by
      # wasm/search/rust-toolchain.toml (rustup reads it because this step runs
      # from inside the crate) — otherwise CI would rebuild with whatever
      # `stable` is that week. And the build goes to a fresh CARGO_TARGET_DIR:
      # rebuilding over a populated target directory — which the cache restores —
      # yields different bytes from the same sources, so the check would fail for
      # reasons unrelated to the change.
      - name: Committed wasm artifact matches its source
        working-directory: wasm/search
        run: |
          export CARGO_TARGET_DIR="$(mktemp -d)"
          cargo build --release --target wasm32-unknown-unknown
          built="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/tlhdig_search.wasm"
          if ! cmp -s "$built" ../../public/wasm/search.wasm; then
            echo "::error file=public/wasm/search.wasm::Stale artifact — run 'npm run build:wasm' and commit the result"
            exit 1
          fi

  web:
    name: Typecheck + lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Currently matches no files; kept so the first test added to scripts/
      # runs in CI without anyone remembering to wire it up.
      - name: Test
        run: npm test

  macos:
    name: Universal .app + DMG
    needs: [check]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli → target

      - name: Build .app + DMG
        working-directory: cli
        run: bash scripts/make_release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aruna-macos-universal
          path: |
            cli/Aruna.app
            cli/releases/Aruna-macos-universal.dmg
            cli/releases/SHA256SUMS
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: aruna-macos-universal
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/Aruna-macos-universal.dmg
            dist/releases/SHA256SUMS
