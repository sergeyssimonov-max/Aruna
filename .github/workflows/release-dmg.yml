# macOS-only: Universal Binary .app + UDIF DMG
name: Release macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Universal .app + DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli → target

      - name: Build .app + DMG
        working-directory: cli
        run: bash scripts/make_release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aruna-macos-universal
          path: |
            cli/Aruna.app
            cli/releases/Aruna-macos-universal.dmg
            cli/releases/SHA256SUMS
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: aruna-macos-universal
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/releases/Aruna-macos-universal.dmg
            dist/releases/SHA256SUMS
