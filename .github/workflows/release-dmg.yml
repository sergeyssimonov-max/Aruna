# macOS-only: Universal Binary .app + UDIF DMG
name: Release macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The reference-release check below reads tags, which a default
          # checkout does not fetch.
          fetch-depth: 0

      # A build that no longer finds a reference tag where it was recorded
      # fails. Rulesets became available when the repository went public and can
      # stop a tag being deleted; they cannot say which commit it was supposed
      # to point at, which is what this checks.
      #
      # There is more than one reference now, and an empty list would make this
      # step pass by having nothing to check — so it refuses that too.
      - name: Reference releases are intact
        run: |
          file=.github/reference-release.json
          count="$(jq '.references | length' "$file")"
          if [ "$count" -lt 1 ]; then
            echo "::error file=$file::No reference releases are recorded. This project measures itself against at least one; restore it, or record the decision to move on."
            exit 1
          fi

          for i in $(seq 0 $((count - 1))); do
            tag="$(jq -r ".references[$i].tag" "$file")"
            want="$(jq -r ".references[$i].commit" "$file")"
            got="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [ -z "$got" ]; then
              echo "::error file=$file::Reference tag $tag is gone. It is a release this project measures itself against; restore it, or record the decision to move on."
              exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error file=$file::Reference tag $tag points at $got, but $want is recorded. A tag that moves is not a reference."
              exit 1
            fi
            echo "$tag is intact at $got"
          done

      # `build_app.sh` reads `version` out of cli/Cargo.toml and writes it into
      # the bundle's CFBundleShortVersionString, so a tag that disagrees with
      # the manifest publishes a DMG whose application reports a different
      # version from the release it is attached to — quietly, and only visible
      # to someone who opens Get Info. cli/README.md has stated the rule from
      # the start; nothing enforced it until now, and a major bump is exactly
      # where a version is most likely to be left behind.
      - name: The tag is the version the manifest declares
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          # The same expression build_app.sh reads it with, so the two cannot
          # disagree about what the manifest says.
          got="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)"
          if [ -z "$got" ]; then
            echo "::error file=cli/Cargo.toml::Could not read a version from the manifest."
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "::error file=cli/Cargo.toml::Tag $GITHUB_REF_NAME does not match version $got in cli/Cargo.toml. The .app takes its version from the manifest, so publishing this would attach an application calling itself $got to a release called $GITHUB_REF_NAME."
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches version $got"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli → target

      - name: Clippy (CLI)
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      # nextest rather than `cargo test`, for one reason: it can stop a test
      # that hangs. The CLI suite spawns the real binary as a child process and
      # opens local sockets, and a test that waits on either of those forever
      # takes the job with it — `cargo test` has no timeout and would sit there
      # until the workflow's own limit killed it, with no output saying which
      # test was stuck. `cli/.config/nextest.toml` sets the deadline; the `ci`
      # profile says more on the way past.
      #
      # It also runs each test in its own process, which is a stricter check
      # than `cargo test` gives: a test that depended on another one's leftover
      # state fails here and passes there.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test (CLI)
        run: cargo nextest run --profile ci --manifest-path cli/Cargo.toml

      # Doctests are the one thing nextest does not run. There are none today;
      # the step is here so that adding one does not silently go unchecked.
      - name: Doctests (CLI)
        run: cargo test --manifest-path cli/Cargo.toml --doc

      # The dependency tree is held to what it holds today: a new licence, a
      # new source or a fresh advisory fails here rather than arriving unnoticed
      # with a transitive dependency. Policy and reasoning in cli/deny.toml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Dependency policy
        run: cargo deny --manifest-path cli/Cargo.toml check

  # The full 24 000-manuscript parse. It lives in its own job because it needs
  # the 71 MiB Zenodo archive, which is not in the repository — so until now the
  # corpus test skipped on every CI run and reported success without parsing
  # anything, while being the test that caught the character-boundary panic on
  # real cuneiform.
  #
  # It gates the release. The cost is a real coupling: the archive comes from an
  # outside service, so a Zenodo outage on a cold cache blocks cutting a
  # release. That is accepted deliberately — shipping a build whose parser was
  # never run against the actual corpus is the worse outcome, and the cache key
  # is the archive digest, so a warm cache needs no network at all.
  corpus:
    name: Full corpus parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli → target

      # Keyed on the digest the CLI verifies against, so republishing the
      # archive invalidates the cache by itself.
      - name: Archive digest
        id: digest
        run: |
          md5="$(sed -n 's/^pub const ZENODO_ZIP_MD5: &str = "\(.*\)";/\1/p' cli/src/download.rs)"
          test -n "$md5" || { echo "::error::could not read ZENODO_ZIP_MD5"; exit 1; }
          echo "md5=$md5" >> "$GITHUB_OUTPUT"

      - name: Cache the TLHdig archive
        id: archive
        uses: actions/cache@v4
        with:
          path: ~/aruna-fixtures
          key: tlhdig-${{ steps.digest.outputs.md5 }}

      - name: Download the archive
        if: steps.archive.outputs.cache-hit != 'true'
        run: |
          url="$(sed -n 's/^ *"\(https:\/\/zenodo.org[^"]*\)";*/\1/p' cli/src/download.rs | head -1)"
          test -n "$url" || { echo "::error::could not read ZENODO_ZIP_URL"; exit 1; }
          mkdir -p ~/aruna-fixtures
          curl -fsSL --retry 3 --retry-delay 5 -o ~/aruna-fixtures/corpus.zip "$url"

      # The test would parse a corrupt archive into confusing failures; check the
      # digest first so a bad download is reported as a bad download.
      - name: Verify the archive
        run: |
          echo "${{ steps.digest.outputs.md5 }}  $HOME/aruna-fixtures/corpus.zip" | md5sum -c -

      # ARUNA_REQUIRE_FIXTURE turns a missing archive into a failure, so this job
      # cannot go back to passing without doing the work.
      - name: Parse the full corpus
        env:
          ARUNA_REQUIRE_FIXTURE: "1"
        run: |
          export ARUNA_FIXTURE_ZIP="$HOME/aruna-fixtures/corpus.zip"
          cargo test --manifest-path cli/Cargo.toml --test integration -- --nocapture

  # The desktop frontend. It replaced a React site that had its own job here,
  # and the shape of the check changed with it: there is no lint step, because
  # the new environment ships no linter, and no separate typecheck, because
  # `check` is svelte-check plus tsc over both tsconfigs.
  #
  # The build runs too. `svelte-check` reads the sources; only `vite build`
  # proves they compile into the `frontend/dist` that tauri.conf.json points
  # `frontendDist` at — and a Tauri bundle with no frontend fails at packaging
  # time, which is far too late.
  frontend:
    name: Check + build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version comes from `packageManager` in the root package.json, so it
      # is stated once and cannot drift from what runs locally.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: frontend
        run: pnpm check

      # Two of these tests read across the language boundary, and both exist
      # because nothing else would notice.
      #
      # The cuneiform font stack is declared twice — here and in
      # `src/inventory/canonical.css`. On 2026-08-23 the copy vanished with the
      # directory it lived in and no check noticed, because none read it.
      # `tests/font-stack.test.ts` reads both files, so a change to the Rust
      # side that is not mirrored fails here rather than shipping a window that
      # draws cuneiform as boxes.
      #
      # `tests/inventory-artifact.test.ts` rebuilds the client script the
      # exported inventory carries and compares it with the copy committed at
      # `cli/src/generated/inventory_filter.js`, which the Rust crate compiles
      # in. That file is committed so `cargo build` never needs Node; this is
      # what keeps it from going stale.
      - name: Test
        working-directory: frontend
        run: pnpm test:unit

      - name: Build
        working-directory: frontend
        run: pnpm build

  # macOS minutes bill at 10× on a private repository, so this job was 20 of the
  # ~26 minutes every push to main cost — to build an artifact that only a
  # release consumes. It now runs when a release is actually being cut, or when
  # asked for by hand.
  #
  # The trade is real: a break in make_release.sh surfaces at tag time instead
  # of on the push that caused it. Cutting a release therefore means running
  # this workflow by hand first, or being ready to move the tag.
  macos:
    name: Universal .app + DMG
    needs: [check, corpus]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli → target

      - name: Build .app + DMG
        working-directory: cli
        run: bash scripts/make_release.sh

      # Handed to the publish job below and wanted by nothing afterwards: what a
      # release keeps is the DMG attached to it, not this. At the default
      # retention the leftovers reached 73 copies and 525 MB, none of which
      # anyone was ever going to download. A day is longer than the run.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aruna-macos-universal
          path: |
            cli/Aruna.app
            cli/releases/Aruna-macos-universal.dmg
            cli/releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: GitHub Release
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: aruna-macos-universal
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/releases/Aruna-macos-universal.dmg
            dist/releases/SHA256SUMS
