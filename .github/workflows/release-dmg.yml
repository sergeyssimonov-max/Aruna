# macOS-only: Universal Binary .app + UDIF DMG
name: Release macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The reference-release check below reads tags, which a default
          # checkout does not fetch.
          fetch-depth: 0

      # GitHub-side tag protection is not available here: rulesets need Pro or a
      # public repository, and immutable releases are not offered on this plan.
      # So the guarantee is enforced where it can be — a build that no longer
      # finds the reference tag where it was recorded fails.
      - name: Reference release is intact
        run: |
          tag="$(jq -r .reference.tag .github/reference-release.json)"
          want="$(jq -r .reference.commit .github/reference-release.json)"
          got="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
          if [ -z "$got" ]; then
            echo "::error file=.github/reference-release.json::Reference tag $tag is gone. It is the release this project measures itself against; restore it, or record the decision to move on."
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error file=.github/reference-release.json::Reference tag $tag points at $got, but $want is recorded. A tag that moves is not a reference."
            exit 1
          fi
          echo "$tag is intact at $got"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            cli → target
            wasm/search → target

      - name: Clippy (CLI)
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Clippy (wasm search)
        run: cargo clippy --manifest-path wasm/search/Cargo.toml --all-targets -- -D warnings

      - name: Test (CLI)
        run: cargo test --manifest-path cli/Cargo.toml

      - name: Test (wasm search)
        run: cargo test --manifest-path wasm/search/Cargo.toml

      - name: Build wasm module for its real target
        run: cargo build --release --target wasm32-unknown-unknown --manifest-path wasm/search/Cargo.toml

      # src/wasm/search.wasm is served to every visitor, so it must be the
      # module this commit actually contains.
      #
      # Two conditions make the comparison meaningful. The compiler is pinned by
      # wasm/search/rust-toolchain.toml (rustup reads it because this step runs
      # from inside the crate) — otherwise CI would rebuild with whatever
      # `stable` is that week. And the build goes to a fresh CARGO_TARGET_DIR:
      # rebuilding over a populated target directory — which the cache restores —
      # yields different bytes from the same sources, so the check would fail for
      # reasons unrelated to the change.
      - name: Committed wasm artifact matches its source
        working-directory: wasm/search
        run: |
          export CARGO_TARGET_DIR="$(mktemp -d)"
          cargo build --release --target wasm32-unknown-unknown
          built="$CARGO_TARGET_DIR/wasm32-unknown-unknown/release/tlhdig_search.wasm"
          if ! cmp -s "$built" ../../src/wasm/search.wasm; then
            echo "::error file=src/wasm/search.wasm::Stale artifact — run 'npm run build:wasm' and commit the result"
            exit 1
          fi

  # The full 24 000-manuscript parse. It lives in its own job because it needs
  # the 71 MiB Zenodo archive, which is not in the repository — so until now the
  # corpus test skipped on every CI run and reported success without parsing
  # anything, while being the test that caught the character-boundary panic on
  # real cuneiform.
  #
  # It gates the release. The cost is a real coupling: the archive comes from an
  # outside service, so a Zenodo outage on a cold cache blocks cutting a
  # release. That is accepted deliberately — shipping a build whose parser was
  # never run against the actual corpus is the worse outcome, and the cache key
  # is the archive digest, so a warm cache needs no network at all.
  corpus:
    name: Full corpus parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli → target

      # Keyed on the digest the CLI verifies against, so republishing the
      # archive invalidates the cache by itself.
      - name: Archive digest
        id: digest
        run: |
          md5="$(sed -n 's/^pub const ZENODO_ZIP_MD5: &str = "\(.*\)";/\1/p' cli/src/download.rs)"
          test -n "$md5" || { echo "::error::could not read ZENODO_ZIP_MD5"; exit 1; }
          echo "md5=$md5" >> "$GITHUB_OUTPUT"

      - name: Cache the TLHdig archive
        id: archive
        uses: actions/cache@v4
        with:
          path: ~/aruna-fixtures
          key: tlhdig-${{ steps.digest.outputs.md5 }}

      - name: Download the archive
        if: steps.archive.outputs.cache-hit != 'true'
        run: |
          url="$(sed -n 's/^ *"\(https:\/\/zenodo.org[^"]*\)";*/\1/p' cli/src/download.rs | head -1)"
          test -n "$url" || { echo "::error::could not read ZENODO_ZIP_URL"; exit 1; }
          mkdir -p ~/aruna-fixtures
          curl -fsSL --retry 3 --retry-delay 5 -o ~/aruna-fixtures/corpus.zip "$url"

      # The test would parse a corrupt archive into confusing failures; check the
      # digest first so a bad download is reported as a bad download.
      - name: Verify the archive
        run: |
          echo "${{ steps.digest.outputs.md5 }}  $HOME/aruna-fixtures/corpus.zip" | md5sum -c -

      # ARUNA_REQUIRE_FIXTURE turns a missing archive into a failure, so this job
      # cannot go back to passing without doing the work.
      - name: Parse the full corpus
        env:
          ARUNA_REQUIRE_FIXTURE: "1"
        run: |
          export ARUNA_FIXTURE_ZIP="$HOME/aruna-fixtures/corpus.zip"
          cargo test --manifest-path cli/Cargo.toml --test integration -- --nocapture

      # The site serves a committed catalog while the CLI parses the archive on
      # every run — two descriptions of one corpus. They had drifted apart
      # unnoticed for lack of anything comparing them: the committed catalog
      # carried 643 manuscripts that were really macOS resource-fork files, and
      # editor and year had moved on in 400 more. Rebuilding it here and
      # comparing is what keeps the site and the CLI saying the same thing.
      - name: The committed catalog matches a fresh parse
        run: |
          out="$(mktemp -d)/inventory.json"
          cargo run --release --manifest-path cli/Cargo.toml \
            --example emit_inventory_json -- "$HOME/aruna-fixtures/corpus.zip" "$out"
          if ! cmp -s "$out" src/data/inventory.json; then
            echo "::error file=src/data/inventory.json::Catalog is stale — regenerate it (see src/data/README.txt) and commit the result"
            diff <(head -c 2000 "$out") <(head -c 2000 src/data/inventory.json) | head -20 || true
            exit 1
          fi

      # …and that the binary the browser downloads was built from that catalog.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: The ARUN binary matches the catalog
        run: |
          before="$(shasum -a 256 < src/data/inventory.bin)"
          node scripts/build-inventory-bin.mjs
          after="$(shasum -a 256 < src/data/inventory.bin)"
          if [ "$before" != "$after" ]; then
            echo "::error file=src/data/inventory.bin::Stale binary — run 'npm run build:data' and commit the result"
            exit 1
          fi

  web:
    name: Typecheck + lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # The runner ships the npm bundled with Node 22 (10.x), but the lockfile is
      # written by npm 12 locally, and the two disagree about which transitive
      # packages belong in it — `npm ci` then refuses to install at all. Pin the
      # same major here so the check tests the lockfile, not the npm skew.
      - name: Pin npm to the version the lockfile is written with
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs src/**/*.test.ts directly: Node 22 strips the types, so the web
      # side needs no build step or test runner of its own.
      - name: Test
        run: npm test

  macos:
    name: Universal .app + DMG
    needs: [check, corpus]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli → target

      - name: Build .app + DMG
        working-directory: cli
        run: bash scripts/make_release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aruna-macos-universal
          path: |
            cli/Aruna.app
            cli/releases/Aruna-macos-universal.dmg
            cli/releases/SHA256SUMS
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: aruna-macos-universal
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/releases/Aruna-macos-universal.dmg
            dist/releases/SHA256SUMS
