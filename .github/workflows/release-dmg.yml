# macOS-only: Universal Binary .app + UDIF DMG
name: Release macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read by default. The one job that needs to write — the one that creates the
# release — asks for it itself, so a token with write access exists only in the
# job that publishes and not in the three that compile, test and build.
permissions:
  contents: read

jobs:
  check:
    name: Tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The reference-release check below reads tags, which a default
          # checkout does not fetch.
          fetch-depth: 0

      # A build that no longer finds a reference tag where it was recorded
      # fails. Rulesets became available when the repository went public and can
      # stop a tag being deleted; they cannot say which commit it was supposed
      # to point at, which is what this checks.
      #
      # There is more than one reference now, and an empty list would make this
      # step pass by having nothing to check — so it refuses that too.
      - name: Reference releases are intact
        run: |
          file=.github/reference-release.json
          count="$(jq '.references | length' "$file")"
          if [ "$count" -lt 1 ]; then
            echo "::error file=$file::No reference releases are recorded. This project measures itself against at least one; restore it, or record the decision to move on."
            exit 1
          fi

          for i in $(seq 0 $((count - 1))); do
            tag="$(jq -r ".references[$i].tag" "$file")"
            want="$(jq -r ".references[$i].commit" "$file")"
            got="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" || true)"
            if [ -z "$got" ]; then
              echo "::error file=$file::Reference tag $tag is gone. It is a release this project measures itself against; restore it, or record the decision to move on."
              exit 1
            fi
            if [ "$got" != "$want" ]; then
              echo "::error file=$file::Reference tag $tag points at $got, but $want is recorded. A tag that moves is not a reference."
              exit 1
            fi
            echo "$tag is intact at $got"
          done

      # `build_app.sh` reads `version` out of cli/Cargo.toml and writes it into
      # the bundle's CFBundleShortVersionString, so a tag that disagrees with
      # the manifest publishes a DMG whose application reports a different
      # version from the release it is attached to — quietly, and only visible
      # to someone who opens Get Info. cli/README.md has stated the rule from
      # the start; nothing enforced it until now, and a major bump is exactly
      # where a version is most likely to be left behind.
      - name: The tag is the version the manifest declares
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          # The same expression build_app.sh reads it with, so the two cannot
          # disagree about what the manifest says.
          got="$(sed -n 's/^version = "\(.*\)"/\1/p' cli/Cargo.toml | head -1)"
          if [ -z "$got" ]; then
            echo "::error file=cli/Cargo.toml::Could not read a version from the manifest."
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "::error file=cli/Cargo.toml::Tag $GITHUB_REF_NAME does not match version $got in cli/Cargo.toml. The .app takes its version from the manifest, so publishing this would attach an application calling itself $got to a release called $GITHUB_REF_NAME."
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches version $got"

      # The version comes from rust-toolchain.toml, which is the one place it is
      # stated; `@stable` used to mean "whatever landed this week", and a new
      # lint in a new stable failed `clippy -D warnings` on pushes that changed
      # nothing.
      - name: Toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^ *channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "::error file=rust-toolchain.toml::no channel pinned"; exit 1; }
          # This value is handed to an action as an input, and the file it comes
          # from is one a pull request can rewrite. A version is this shape or it
          # is not a version.
          case "$channel" in
            *[!A-Za-z0-9._-]*) echo "::error file=rust-toolchain.toml::channel '$channel' is not a toolchain name"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli → target

      # docs/TESTING.md has listed `cargo fmt --check` among the checks a change
      # is held to since before there was a CI file; nothing ran it, so the
      # document described work no machine did. It runs first because it is the
      # cheapest of the gates and the one most likely to be forgotten.
      - name: Formatting (CLI)
        run: cargo fmt --manifest-path cli/Cargo.toml --check

      - name: Clippy (CLI)
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      # `bench` is off by default and the binary never enables it, so
      # `--all-targets` alone never compiles `examples/bench_fields.rs` — it
      # declares `required-features = ["bench"]` and is simply skipped. The
      # example measures the parse's hot path, which is the code most likely to
      # be rewritten, and nothing has been type-checking it. docs/TESTING.md has
      # listed this invocation among the standard checks all along.
      - name: Clippy (CLI, bench feature)
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets --features bench -- -D warnings

      # nextest rather than `cargo test`, for one reason: it can stop a test
      # that hangs. The CLI suite spawns the real binary as a child process and
      # opens local sockets, and a test that waits on either of those forever
      # takes the job with it — `cargo test` has no timeout and would sit there
      # until the workflow's own limit killed it, with no output saying which
      # test was stuck. `cli/.config/nextest.toml` sets the deadline; the `ci`
      # profile says more on the way past.
      #
      # It also runs each test in its own process, which is a stricter check
      # than `cargo test` gives: a test that depended on another one's leftover
      # state fails here and passes there.
      - name: Install nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: nextest

      - name: Test (CLI)
        run: cargo nextest run --profile ci --manifest-path cli/Cargo.toml

      # Doctests are the one thing nextest does not run. There are none today;
      # the step is here so that adding one does not silently go unchecked.
      - name: Doctests (CLI)
        run: cargo test --manifest-path cli/Cargo.toml --doc

      # The dependency tree is held to what it holds today: a new licence, a
      # new source or a fresh advisory fails here rather than arriving unnoticed
      # with a transitive dependency. Policy and reasoning in cli/deny.toml.
      - name: Install cargo-deny
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-deny

      - name: Dependency policy
        run: cargo deny --manifest-path cli/Cargo.toml check

  # The desktop crate, held to the same battery `docs/PROJECT-SPEC.ru.md` §6.1
  # prescribes for it locally. Until now nothing here touched `src-tauri` at
  # all: five jobs, none of them naming the crate, so its formatting, its
  # lints, its one test and `src-tauri/deny.toml` — a policy file written on
  # 2026-08-23 and never executed — were held by whoever remembered to run them
  # by hand.
  #
  # **On macOS, not on Ubuntu.** The only platform this project targets is
  # macOS 13 (CLAUDE.md, «Платформа»), and a Tauri crate on Linux needs the
  # GTK and WebKitGTK development packages to compile at all. Checking it there
  # would mean installing a toolchain for a configuration nobody ships in order
  # to learn nothing about the one that is.
  #
  # It does not gate the release. What the DMG carries is built by
  # `cli/scripts/make_release.sh` from the console crate; the desktop shell
  # ships in nothing today, so failing it must not stop a release of something
  # it is not part of. When the first Tauri command exists, this job belongs in
  # the `needs` list of `macos` — and that is a decision to take then.
  desktop:
    name: Check + clippy (src-tauri)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pin in rust-toolchain.toml decides, exactly as in the jobs above.
      - name: Toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^ *channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "::error file=rust-toolchain.toml::no channel pinned"; exit 1; }
          # The same guard the other jobs carry, and for the same reason: this
          # value is handed to an action as an input, and it comes out of a file
          # a pull request can rewrite.
          case "$channel" in
            *[!A-Za-z0-9._-]*) echo "::error file=rust-toolchain.toml::channel '$channel' is not a toolchain name"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri → target

      - name: Formatting (src-tauri)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # `--all-features` on purpose: it turns on `e2e`, and that branch has to
      # be type-checked. The same flag on nextest below would be a mistake —
      # see the step's own note.
      - name: Clippy (src-tauri)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: nextest

      # Without `--all-features`, and that is the condition of the test running
      # at all: the one test in this crate asserts what a build *without* `e2e`
      # registers, and it is compiled out under the feature. `--no-tests=pass`
      # stays as insurance for a crate that temporarily has none. §6.1 of the
      # specification states both.
      - name: Test (src-tauri)
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --no-tests=pass

      - name: Install cargo-deny
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2
        with:
          tool: cargo-deny

      # `src-tauri/deny.toml` carries its own platform filter, so this asks
      # about the two Apple targets and not about the Linux half of the tree.
      - name: Dependency policy (src-tauri)
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  # The full 24 000-manuscript parse. It lives in its own job because it needs
  # the 71 MiB Zenodo archive, which is not in the repository — so until now the
  # corpus test skipped on every CI run and reported success without parsing
  # anything, while being the test that caught the character-boundary panic on
  # real cuneiform.
  #
  # It gates the release. The cost is a real coupling: the archive comes from an
  # outside service, so a Zenodo outage on a cold cache blocks cutting a
  # release. That is accepted deliberately — shipping a build whose parser was
  # never run against the actual corpus is the worse outcome, and the cache key
  # is the archive digest, so a warm cache needs no network at all.
  corpus:
    name: Full corpus parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The version comes from rust-toolchain.toml, which is the one place it is
      # stated; `@stable` used to mean "whatever landed this week", and a new
      # lint in a new stable failed `clippy -D warnings` on pushes that changed
      # nothing.
      - name: Toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^ *channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "::error file=rust-toolchain.toml::no channel pinned"; exit 1; }
          # This value is handed to an action as an input, and the file it comes
          # from is one a pull request can rewrite. A version is this shape or it
          # is not a version.
          case "$channel" in
            *[!A-Za-z0-9._-]*) echo "::error file=rust-toolchain.toml::channel '$channel' is not a toolchain name"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli → target

      # Keyed on the digest the CLI verifies against, so republishing the
      # archive invalidates the cache by itself.
      - name: Archive digest
        id: digest
        run: |
          md5="$(sed -n 's/^pub const ZENODO_ZIP_MD5: &str = "\(.*\)";/\1/p' cli/src/download.rs)"
          test -n "$md5" || { echo "::error::could not read ZENODO_ZIP_MD5"; exit 1; }
          # A digest is 32 hex characters. Anything else came from a source file
          # someone edited into something that is not a digest, and it would go
          # on to be a cache key and an argument to md5sum.
          case "$md5" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "::error file=cli/src/download.rs::ZENODO_ZIP_MD5 is not a 32-character hex digest"; exit 1 ;;
          esac
          echo "md5=$md5" >> "$GITHUB_OUTPUT"

      - name: Cache the TLHdig archive
        id: archive
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/aruna-fixtures
          key: tlhdig-${{ steps.digest.outputs.md5 }}

      - name: Download the archive
        if: steps.archive.outputs.cache-hit != 'true'
        run: |
          url="$(sed -n 's/^ *"\(https:\/\/zenodo.org[^"]*\)";*/\1/p' cli/src/download.rs | head -1)"
          test -n "$url" || { echo "::error::could not read ZENODO_ZIP_URL"; exit 1; }
          mkdir -p ~/aruna-fixtures
          curl -fsSL --retry 3 --retry-delay 5 -o ~/aruna-fixtures/corpus.zip "$url"

      # The test would parse a corrupt archive into confusing failures; check the
      # digest first so a bad download is reported as a bad download.
      #
      # The digest arrives through the environment rather than as `${{ }}` inside
      # the script. An expression is substituted into the line as text before any
      # shell sees it, and this one is read out of `cli/src/download.rs` — a file
      # a pull request can rewrite, and this workflow runs on pull requests. A
      # constant ending in `"; curl …` would be a command, not a digest. Through
      # `env:` it is a value, whatever it contains.
      - name: Verify the archive
        env:
          MD5: ${{ steps.digest.outputs.md5 }}
        run: |
          echo "$MD5  $HOME/aruna-fixtures/corpus.zip" | md5sum -c -

      # ARUNA_REQUIRE_FIXTURE turns a missing archive into a failure, so this job
      # cannot go back to passing without doing the work.
      # Both suites, not just `integration`. `tests/corpus.rs` is the one that
      # measures the corpus itself — 663 groups, 23 936 documents, every
      # document the gates admit surviving a decode intact — and it was skipping
      # silently here while the job's name said "Full corpus parse". A suite
      # that reports success without the archive is exactly what
      # ARUNA_REQUIRE_FIXTURE exists to prevent, and it was set on a command
      # that never reached that file.
      - name: Parse the full corpus
        env:
          ARUNA_REQUIRE_FIXTURE: "1"
        run: |
          export ARUNA_FIXTURE_ZIP="$HOME/aruna-fixtures/corpus.zip"
          cargo test --manifest-path cli/Cargo.toml --test integration --test corpus -- --nocapture

  # The desktop frontend. It replaced a React site that had its own job here,
  # and the shape of the check changed with it: no separate typecheck, because
  # `check` is svelte-check plus tsc over both tsconfigs.
  #
  # This comment used to say there was no lint step because the environment
  # shipped no linter. ESLint and Prettier are both in `frontend/package.json`
  # with `lint` and `format:check` scripts, and the specification requires both
  # before a commit — so the sentence was describing an environment that had
  # moved on, and two of the project's own gates ran nowhere.
  #
  # The build runs too. `svelte-check` reads the sources; only `vite build`
  # proves they compile into the `frontend/dist` that tauri.conf.json points
  # `frontendDist` at — and a Tauri bundle with no frontend fails at packaging
  # time, which is far too late.
  frontend:
    name: Check + build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The version comes from `packageManager` in the root package.json, so it
      # is stated once and cannot drift from what runs locally.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: frontend
        run: pnpm check

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Formatting
        working-directory: frontend
        run: pnpm format:check

      # Two of these tests read across the language boundary, and both exist
      # because nothing else would notice.
      #
      # The cuneiform font stack is declared twice — here and in
      # `src/inventory/canonical.css`. On 2026-08-23 the copy vanished with the
      # directory it lived in and no check noticed, because none read it.
      # `tests/font-stack.test.ts` reads both files, so a change to the Rust
      # side that is not mirrored fails here rather than shipping a window that
      # draws cuneiform as boxes.
      #
      # `tests/inventory-artifact.test.ts` rebuilds the client script the
      # exported inventory carries and compares it with the copy committed at
      # `cli/src/generated/inventory_filter.js`, which the Rust crate compiles
      # in. That file is committed so `cargo build` never needs Node; this is
      # what keeps it from going stale.
      - name: Test
        working-directory: frontend
        run: pnpm test:unit

      - name: Build
        working-directory: frontend
        run: pnpm build

  # macOS minutes bill at 10× on a private repository, so this job was 20 of the
  # ~26 minutes every push to main cost — to build an artifact that only a
  # release consumes. It now runs when a release is actually being cut, or when
  # asked for by hand.
  #
  # The trade is real: a break in make_release.sh surfaces at tag time instead
  # of on the push that caused it. Cutting a release therefore means running
  # this workflow by hand first, or being ready to move the tag.
  macos:
    name: Universal .app + DMG
    # The frontend is a gate on the DMG, not merely a neighbour of it: the crate
    # compiles in `cli/src/generated/`, which `frontend/tests/inventory-artifact
    # .test.ts` proves is what the frontend stack builds today. Without that
    # edge a red frontend job still produced a signed DMG carrying a stale
    # client script — green release, wrong artifact.
    needs: [check, corpus, frontend]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      # Full history, and `build_app.sh` is why: it takes the bundle's
      # `CFBundleVersion` from `git rev-list --count HEAD`, so that LaunchServices
      # — which caches an application by that number — can tell two releases
      # apart. A shallow checkout has one commit, so the published DMG carried
      # build 1 while the same commit built locally carried 168. Nothing failed
      # loudly; it was found by mounting the published image and reading its
      # Info.plist.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # As above: the pin in rust-toolchain.toml decides, and the DMG is the
      # artifact where a surprise compiler is least welcome.
      - name: Toolchain
        id: toolchain
        run: |
          channel="$(sed -n 's/^ *channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "::error file=rust-toolchain.toml::no channel pinned"; exit 1; }
          # This value is handed to an action as an input, and the file it comes
          # from is one a pull request can rewrite. A version is this shape or it
          # is not a version.
          case "$channel" in
            *[!A-Za-z0-9._-]*) echo "::error file=rust-toolchain.toml::channel '$channel' is not a toolchain name"; exit 1 ;;
          esac
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust (universal targets)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: cli → target

      - name: Build .app + DMG
        working-directory: cli
        run: bash scripts/make_release.sh

      # Handed to the publish job below and wanted by nothing afterwards: what a
      # release keeps is the DMG attached to it, not this. At the default
      # retention the leftovers reached 73 copies and 525 MB, none of which
      # anyone was ever going to download. A day is longer than the run.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aruna-macos-universal
          path: |
            cli/Aruna.app
            cli/releases/Aruna-macos-universal.dmg
            cli/releases/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    name: GitHub Release
    needs: [macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job that writes anything back to the repository, and the only one
    # whose token can. Everything above it reads.
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: aruna-macos-universal
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          files: |
            dist/releases/Aruna-macos-universal.dmg
            dist/releases/SHA256SUMS
