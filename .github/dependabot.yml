# Security updates only. Version updates are switched off deliberately.
#
# Two things in this repository are pinned by exact identity rather than by
# range: the Actions in `workflows/`, by commit SHA, and the npm packages in
# `frontend/`, by exact version because the specification requires it. Both were
# chosen so that nothing changes unless someone decides it should — and
# `CLAUDE.md` says the same in the other direction: a version is raised only
# when the release notes have been read, the release is at least a week old, and
# there is a reason. "Just in case" is forbidden.
#
# Scheduled version updates are the opposite of that rule. Turned on for one
# month they produced five pull requests, none with a reason behind it, one of
# them a major bump of `zip` that fails CI on arrival. Reviewing them is work
# the project did not ask for, and closing them unread is worse than not being
# offered them.
#
# `open-pull-requests-limit: 0` is how a version-update entry is disabled while
# the ecosystem stays configured. Security updates are a different job — they
# come from Dependabot alerts rather than from this schedule, and this limit
# does not apply to them — so an advisory against a pinned dependency still
# arrives as a pull request. Alerts and automated security fixes were enabled on
# the repository on 2026-08-25; without them this file would be silent.
#
# `cargo audit` and `cargo deny` already fail CI on a new advisory. That says a
# problem exists; this says which release answers it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directories:
      - "/"
      - "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directories:
      - "/cli"
      - "/src-tauri"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
