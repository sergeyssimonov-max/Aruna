# Test-runner settings. `cargo test` ignores this file; `cargo nextest run`
# reads it, and the difference that matters is the one below.

[profile.default]
# A guard against hanging, not a performance target. The suite spawns the real
# binary as a child process and opens local sockets, and a test that waits on
# one of those forever takes CI with it — nothing else here can stop that. The
# slowest test in the set takes about seven seconds (the download retries, which
# wait out real backoff), so thirty seconds is a warning that something is
# wrong and two minutes is the point at which it is killed and reported.
slow-timeout = { period = "30s", terminate-after = 4 }

# How long after a test's process exits nextest waits for its output pipe to
# close before calling the test leaky. 100 ms is nextest's own default.
#
# It was 2 s from 2026-09-19 (`5ae9cfa`) to 2026-09-25, and the reason given
# then was wrong. `cancelling::a_running_build_stops_when_the_window_asks` came
# back LEAK in the heavy `#[ignore]` set, intermittently and only beside the two
# tests that spawn one `xmllint` and one `xsltproc` per document; it spawns
# nothing itself, so the machine's load was blamed and the wait raised as "a
# budget for the scheduler". The cause was nextest's: before 0.9.145, on Apple
# platforms – where Rust's std cannot create a pipe with `FD_CLOEXEC` set
# atomically – a test spawned at the same moment as another could inherit the
# other's capture pipe and keep it open, and the other was reported leaky.
# Fixed in cargo-nextest 0.9.145 (changelog, 2026-09-16).
#
# Measured 2026-09-25 on the heavy set, 633 tests, host idle 90–97 %: 0.9.143
# at 100 ms flagged `paths::tests::an_unwritable_destination_is_refused_up_front`
# (it spawns nothing either) in one run of three; 0.9.145 at 100 ms flagged
# nothing in five. A test that really leaves a `sleep 5` behind is LEAK under
# both versions at 100 ms, so the setting still catches a leak.
leak-timeout = "100ms"

# A failure that is hard to reproduce is worth all of its output.
failure-output = "immediate-final"
status-level = "fail"

# Retries are deliberately absent. A flaky test is a defect to find, and
# retrying it here would hide exactly the intermittent failures this suite
# exists to catch.

[profile.ci]
# Same guards, more said out loud: CI has no one watching it run.
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = "100ms"
failure-output = "immediate-final"
status-level = "all"
final-status-level = "slow"
