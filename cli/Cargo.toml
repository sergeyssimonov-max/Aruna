[package]
name = "aruna"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Aruna — generates a Scandinavian-style HTML inventory of TLHdig (Zenodo) Hittite cuneiform transliterations"
authors = ["Sergey Simonov"]
license = "MIT"
repository = "https://github.com/sergeyssimonov-max/Aruna"
readme = "README.md"
keywords = ["hittite", "cuneiform", "tlhdig", "zenodo", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
dirs = "5"
memchr = "2"
thiserror = "2"
ureq = { version = "2.12", default-features = true, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
# No `panic = "abort"`: a panic here must print where it happened. Aborting
# turned a parser bug into a silent crash with no message for the user.

[profile.dev]
opt-level = 1
