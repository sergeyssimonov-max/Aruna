[package]
name = "aruna"
version = "2.4.0"
edition = "2021"
# Verified rather than asserted: `cargo +1.86 check --locked --all-targets`
# passes, and CI runs it on every push so the number cannot quietly stop being
# true. It comes from the dependencies, not from this crate's own code — the
# toolchain everything is developed and measured with is pinned separately, in
# `rust-toolchain.toml`, at 1.97.1.
rust-version = "1.86"
description = "Aruna — generates a Scandinavian-style HTML inventory of TLHdig (Zenodo) Hittite cuneiform transliterations"
authors = ["Sergey Simonov"]
license = "MIT"
repository = "https://github.com/sergeyssimonov-max/Aruna"
readme = "README.md"
keywords = ["hittite", "cuneiform", "tlhdig", "zenodo", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
dirs = "5"
memchr = "2"
thiserror = "2"
ureq = { version = "2.12", default-features = true, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[features]
# Opens `parse::fields` for measurement. Off by default and never enabled by the
# binary: the extractors are the parse's hot path, and timing them individually
# is what makes replacing them individually checkable.
bench = []

[[example]]
name = "bench_fields"
required-features = ["bench"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
# No `panic = "abort"`: a panic here must print where it happened. Aborting
# turned a parser bug into a silent crash with no message for the user.

[profile.dev]
opt-level = 1
