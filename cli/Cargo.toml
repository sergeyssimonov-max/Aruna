[package]
name = "aruna"
version = "2.5.2"
edition = "2021"
description = "Aruna — generates a Scandinavian-style HTML inventory of TLHdig (Zenodo) Hittite cuneiform transliterations"
authors = ["Sergey Simonov"]
license = "MIT"
repository = "https://github.com/sergeyssimonov-max/Aruna"
readme = "README.md"
keywords = ["hittite", "cuneiform", "tlhdig", "zenodo", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
dirs = "5"
memchr = "2"
thiserror = "2"
ureq = { version = "2.12", default-features = true, features = ["tls"] }
# Floor at 2.3, not 2.2: RUSTSEC-2025-0168 (CVE-2025-29787) is patched there,
# and a lock file resolved from a lower floor is one `cargo update` away from
# picking a vulnerable version back up.
zip = { version = "2.3", default-features = false, features = ["deflate"] }

[features]
# Opens `parse::fields` for measurement. Off by default and never enabled by the
# binary: the extractors are the parse's hot path, and timing them individually
# is what makes replacing them individually checkable.
bench = []

[[example]]
name = "bench_fields"
required-features = ["bench"]

[dev-dependencies]
tempfile = "3"
