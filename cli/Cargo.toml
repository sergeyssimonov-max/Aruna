[package]
name = "aruna"
version = "2.6.2"
edition = "2021"
description = "Aruna — generates a Scandinavian-style HTML inventory of TLHdig (Zenodo) Hittite cuneiform transliterations"
authors = ["Sergey Simonov"]
license = "MIT"
repository = "https://github.com/sergeyssimonov-max/Aruna"
readme = "README.md"
keywords = ["hittite", "cuneiform", "tlhdig", "zenodo", "cli"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
dirs = "5"
memchr = "2"
# Pinned exactly, and without default features: the XML parser candidate of
# specification 4.13, here for the classification step and nothing else. The
# rule that nothing is ever expanded — entities, DTDs, XInclude — is kept by
# not calling anything that expands, not by a setting that can be forgotten.
quick-xml = { version = "=0.42.0", default-features = false }
thiserror = "2"
ureq = { version = "2.12", default-features = true, features = ["tls"] }
# Floor at 2.3, not 2.2: RUSTSEC-2025-0168 (CVE-2025-29787) is patched there,
# and a lock file resolved from a lower floor is one `cargo update` away from
# picking a vulnerable version back up.
zip = { version = "2.3", default-features = false, features = ["deflate"] }
# The PDF of every document (specification 4.10; owner's decisions of
# 2026-09-30, questions 2, 9 and 16 of the design note): the typesetting
# engine, pinned exactly, in the core without a Cargo feature – one
# configuration, paid once. krilla 0.8.2 comes through typst-pdf and is not
# named here. The one line of the engine has to stand at one version (3.8).
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
# In the working path, not only in checks: the marker's invisible text layer
# and the ActualText wrappers of a repeated cluster are written by editing the
# finished PDF (decisions of 2026-09-27 and 2026-09-28).
lopdf = "=0.45.0"
# The outlines of the main face for the letters of a marker (variant B).
# Already in the tree through Typst; this names it. Not ttf-parser, also in the
# tree: it carries an unmaintained advisory (RUSTSEC-2026-0192), which
# cargo-deny rightly refuses for a direct dependency.
skrifa = "=0.42.1"

[features]
# Opens `parse::fields` for measurement. Off by default and never enabled by the
# binary: the extractors are the parse's hot path, and timing them individually
# is what makes replacing them individually checkable.
bench = []

[[example]]
name = "bench_fields"
required-features = ["bench"]

[dev-dependencies]
tempfile = "3"
