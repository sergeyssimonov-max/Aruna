<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Hittite cuneiform clay tablet">
  <!-- Full-bleed clay field (Dock applies squircle) -->
  <rect width="1024" height="1024" fill="#EFE6D8"/>

  <!--
    Hittite cuneiform = Mesopotamian-style impressed wedges:
    • horizontal (→)  • vertical (↓)  • Winkelhaken (corner)
    Contour logo, single clay-brown. No hieroglyphic silhouettes.
  -->
  <g fill="none" stroke="#9A6B3F" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tablet outline -->
    <rect x="248" y="152" width="528" height="720" rx="36" ry="36"/>
  </g>

  <!-- Wedges as filled nail-heads (classic cuneiform impression look) -->
  <g fill="#9A6B3F">
    <!-- ===== Row 1 ===== -->
    <!-- 𒀸-like: vertical wedge -->
    <path d="M300 210 l18 0 -9 62 z"/>
    <!-- horizontal wedge -->
    <path d="M340 220 l70 0 -12 22 -58 0 z"/>
    <!-- Winkelhaken -->
    <path d="M430 218 l48 0 0 18 -30 0 0 36 -18 0 z"/>
    <!-- two stacked horizontals (ME-like) -->
    <path d="M500 212 l64 0 -10 16 -54 0 z"/>
    <path d="M500 242 l64 0 -10 16 -54 0 z"/>
    <!-- vertical + Winkelhaken -->
    <path d="M590 210 l16 0 -8 64 z"/>
    <path d="M620 220 l58 0 0 16 -40 0 0 28 -18 0 z"/>
    <!-- diagonal pair -->
    <path d="M700 218 l52 14 -14 20 -52 -14 z"/>

    <!-- ===== Row 2 ===== -->
    <path d="M305 310 l72 0 -12 20 -60 0 z"/>
    <path d="M395 300 l18 0 -9 68 z"/>
    <path d="M430 312 l28 0 0 48 -28 0 z"/>
    <!-- AŠ / multi-wedge cluster -->
    <path d="M480 308 l60 0 -10 18 -50 0 z"/>
    <path d="M495 300 l14 0 -7 58 z"/>
    <path d="M560 310 l68 0 -12 20 -56 0 z"/>
    <path d="M650 300 l16 0 -8 66 z"/>
    <path d="M685 315 l55 0 0 16 -36 0 0 26 -19 0 z"/>

    <!-- ===== Row 3 ===== -->
    <path d="M300 400 l16 0 -8 68 z"/>
    <path d="M335 415 l66 0 -12 20 -54 0 z"/>
    <path d="M420 408 l50 0 0 16 -32 0 0 36 -18 0 z"/>
    <!-- three verticals (small) -->
    <path d="M500 400 l12 0 -6 64 z"/>
    <path d="M528 400 l12 0 -6 64 z"/>
    <path d="M556 400 l12 0 -6 64 z"/>
    <path d="M590 412 l70 0 -12 20 -58 0 z"/>
    <path d="M680 405 l16 0 -8 66 z"/>
    <path d="M715 418 l50 12 -12 18 -50 -12 z"/>

    <!-- ===== Row 4 ===== -->
    <path d="M310 512 l68 0 -12 20 -56 0 z"/>
    <path d="M310 548 l68 0 -12 20 -56 0 z"/>
    <path d="M400 505 l18 0 -9 70 z"/>
    <path d="M440 518 l58 0 0 16 -38 0 0 30 -20 0 z"/>
    <path d="M525 512 l64 0 -11 20 -53 0 z"/>
    <path d="M610 505 l16 0 -8 68 z"/>
    <path d="M645 515 l55 14 -14 18 -55 -14 z"/>
    <path d="M720 510 l18 0 -9 66 z"/>

    <!-- ===== Row 5 ===== -->
    <path d="M305 620 l16 0 -8 64 z"/>
    <path d="M340 632 l62 0 -11 18 -51 0 z"/>
    <path d="M425 625 l48 0 0 15 -30 0 0 34 -18 0 z"/>
    <path d="M500 620 l14 0 -7 66 z"/>
    <path d="M535 632 l66 0 -11 18 -55 0 z"/>
    <path d="M620 622 l14 0 -7 64 z"/>
    <path d="M655 630 l58 0 0 16 -38 0 0 28 -20 0 z"/>
    <path d="M735 628 l40 10 -10 16 -40 -10 z"/>

    <!-- ===== Row 6 (shorter bottom) ===== -->
    <path d="M320 730 l70 0 -12 20 -58 0 z"/>
    <path d="M410 722 l16 0 -8 60 z"/>
    <path d="M450 735 l55 0 0 14 -34 0 0 26 -21 0 z"/>
    <path d="M530 728 l62 0 -11 18 -51 0 z"/>
    <path d="M615 722 l16 0 -8 60 z"/>
    <path d="M655 732 l60 0 -10 18 -50 0 z"/>
  </g>
</svg>
