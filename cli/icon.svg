<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Hittite clay tablet">
  <!--
    Outer plate: continuous-corner radius ~22.5% (Apple app-icon grid).
    Full opaque field so Dock squircle doesn’t leave sharp corners.
  -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#E6CFA8"/>

  <!-- Tablet — evenly rounded, single contour -->
  <rect x="248" y="156" width="528" height="712" rx="56" ry="56"
        fill="none" stroke="#9A6B3F" stroke-width="18" stroke-linejoin="round"/>

  <!-- Triangle wedges, same stroke -->
  <g fill="none" stroke="#9A6B3F" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <path d="M360 300 h100 l-50 72z"/>
    <path d="M490 300 h100 l-50 72z"/>
    <path d="M620 300 h74 l-37 72z"/>
    <path d="M360 420 h100 l-50 72z"/>
    <path d="M490 420 h100 l-50 72z"/>
    <path d="M620 420 h74 l-37 72z"/>
    <path d="M360 540 h100 l-50 72z"/>
    <path d="M490 540 h100 l-50 72z"/>
    <path d="M620 540 h74 l-37 72z"/>
    <path d="M425 660 h100 l-50 72z"/>
    <path d="M555 660 h100 l-50 72z"/>
  </g>
</svg>
