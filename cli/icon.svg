<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Hittite clay tablet">
  <!-- Warm paper field -->
  <rect width="1024" height="1024" rx="220" fill="#F3EDE3"/>
  <!-- Contour tablet -->
  <rect x="250" y="160" width="524" height="704" rx="40"
