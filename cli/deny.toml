# What this dependency tree is allowed to contain.
#
# The list below is not a policy someone chose in the abstract: it is what the
# tree holds today, written down. Every entry was read out of `cargo metadata`
# and is present because some crate here needs it. The point of recording it is
# that a *new* licence then becomes a decision someone makes on purpose, with a
# failing check to prompt it, rather than something that arrives with a
# transitive dependency and is noticed by nobody.
#
# Adding to `allow` is fine. It should just be a separate, visible act.
#
#   cargo deny check            — everything below
#   cargo deny check licenses   — this section alone

[licenses]
# Nearly every crate here offers `MIT OR Apache-2.0`; allowing MIT settles all
# of those, and the rest are listed because they have no permissive
# alternative in their own expression.
allow = [
    "MIT",
    # `zopfli` (via `zip`) is Apache-2.0 alone, and `Apache-2.0 AND ISC` needs
    # both halves.
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # `rustls-webpki` and `untrusted`, under `ureq`.
    "ISC",
    # The ICU stack, 19 crates, reached through URL parsing. One of them —
    # `unicode-ident` — is `(MIT OR Apache-2.0) AND Unicode-3.0`, so this is
    # required rather than merely offered.
    "Unicode-3.0",
    # `webpki-roots`: the root certificate bundle TLS verifies against.
    "CDLA-Permissive-2.0",
    # `subtle`, the constant-time comparison helper under `ring`.
    "BSD-3-Clause",
    # `option-ext`, a transitive of `dirs`. The only weak-copyleft licence in
    # the tree; MPL-2.0 is file-level, and this crate is used unmodified, so it
    # asks nothing of Aruna's own source. Named here so that stays a conscious
    # fact rather than a discovery.
    "MPL-2.0",
]

# A licence expression this cannot read with 80 % confidence is worth a human
# reading it, not a guess.
confidence-threshold = 0.8

[bans]
# Duplicate versions of one crate are ordinary in a transitive tree and are not
# a defect here; `deny` would fail the build over the several `windows-*`
# generations that arrive through `ring` and `dirs`.
multiple-versions = "allow"
# Nothing is banned outright. The list exists so that banning something is
# possible without inventing this file first.
deny = []

[advisories]
# RustSec's own severity is the judgement; anything it reports should be looked
# at rather than pre-forgiven here. No ignores: an advisory silenced in a
# config file is an advisory nobody reads again.
ignore = []

[sources]
# Everything comes from crates.io. A dependency pulled from a git remote or a
# private registry would be a change worth noticing.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
